<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>SIGMA6</title>
<style>
  html, body {
    margin: 0; height: 100%; background: #000; overflow: hidden;
    overscroll-behavior: none; -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }
  /* Рабочая область = экран минус безопасные зоны и запас снизу */
  #stage {
    position: fixed; background: #000;
    top: env(safe-area-inset-top, 0px);
    right: env(safe-area-inset-right, 0px);
    left: env(safe-area-inset-left, 0px);
    --bottom-extra: 18px;
    height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px) - var(--bottom-extra));
  }
  /* Чёрная подложка при развороте: закрывает и блокирует остальные окна */
  #veil { position: absolute; inset: 0; background: #000; z-index: 5; opacity: 0; pointer-events: none; }
  #veil.on { opacity: 1; pointer-events: auto; }

  .slot { position: absolute; overflow: hidden; background: #000; outline: 1px solid #2a2a2a; z-index: 1; }
  .slot.open { z-index: 10; }
  #stage.has-open .slot:not(.open) { pointer-events: none; }
  .slot.anim, .nick.anim { transition: left .2s ease, top .2s ease, width .2s ease, height .2s ease; }
  .slot.anim .scaler { transition: transform .2s ease; }
  /* iframe всегда 360x640 и только масштабируется: разворот не перезагружает страницу */
  .scaler { position: absolute; left: 0; top: 0; width: 360px; height: 640px; transform-origin: 0 0; }
  .scaler iframe { width: 100%; height: 100%; border: 0; display: block; background: #000; }

  /* Кнопка разворота: маленький оранжевый шарик, без мерцания */
  .btn { position: absolute; right: 3px; bottom: 3px; width: 7px; height: 7px; z-index: 3; padding: 0;
    border: 0; border-radius: 50%; background: #ff9a1f; touch-action: manipulation; }
  .btn::after { content: ""; position: absolute; inset: -18px; } /* зона касания (в сетке 9 окон) */
  /* В развёрнутом режиме кнопка прежнего размера и положения */
  .slot.open .btn { right: 8px; bottom: 8px; width: 14px; height: 14px; }
  .slot.open .btn::after { inset: -15px; }

  .chip { position: absolute; left: 4px; top: 4px; right: 40px; z-index: 3; pointer-events: none;
    font: 10px/1.25 -apple-system, system-ui, sans-serif; color: #ddd; background: rgba(0,0,0,.78);
    padding: 3px 5px; border-radius: 4px; transition: opacity .4s; }
  .chip.err { color: #ffb4b4; }
  .chip.hide { opacity: 0; }

  /* Полоса с ником над окном (без рамок), высота ~3 мм */
  .nick { position: absolute; height: 19px; z-index: 4; display: flex; align-items: center; overflow: visible; }
  .nick.hide { opacity: 0; pointer-events: none; }
  .nick.locked { z-index: 12; pointer-events: none; }
  .nick.locked .dot { display: none; }
  /* Точка редактирования (~10 px): синяя = просмотр, красная = правка */
  .dot { position: relative; flex: none; width: 10.4px; height: 10.4px; margin: 0 6px 0 2px; padding: 0; border: 0;
    border-radius: 50%; background: #2f80ff; touch-action: manipulation; }
  .dot::after { content: ""; position: absolute; inset: -8.3px -11.3px; } /* зона касания шире точки */
  .dot.edit { background: #ff3b30; }
  .nick input { flex: 1; min-width: 0; height: 19px; margin: 0; padding: 0; border: 0; outline: 0;
    background: transparent; color: #fff; font: 600 16px/19px -apple-system, system-ui, sans-serif;
    pointer-events: none; -webkit-appearance: none; appearance: none; border-radius: 0; }
  .nick input.edit { pointer-events: auto; }
  .nick input::placeholder { color: #555; font-weight: 400; }
</style>
</head>
<body>
<div id="stage"><div id="veil"></div></div>

<script>
(function () {
  var GAME_URL = 'https://www.google.com/';
  // Проверка без правки файла: index.html?u=https://адрес  (любой адрес в окнах)
  try {
    var qu = new URLSearchParams(location.search).get('u');
    if (qu && (qu === 'test' || /^https?:\/\//i.test(qu))) GAME_URL = qu;   // ?u=test — встроенная проверка окон
  } catch (e) {}
  var DW = 360, DH = 640;      // логический размер окна 9:16
  var GAP = 3;                 // промежуток между ячейками по горизонтали
  var NH = 19;                 // высота полосы ника (~3 мм)
  var COLS = 3, ROWS = 3, COUNT = COLS * ROWS;
  var TIMEOUT_MS = 12000;
  var NICK_KEY = 'sigma6_nicks_v1';

  var stage = document.getElementById('stage');
  var veil = document.getElementById('veil');
  var wins = [];
  var openIdx = -1;
  var nicks = [];
  try { nicks = JSON.parse(localStorage.getItem(NICK_KEY) || '[]') || []; } catch (e) { nicks = []; }

  function saveNicks() { try { localStorage.setItem(NICK_KEY, JSON.stringify(nicks)); } catch (e) {} }

  function makeChip(w, text, isErr, fadeMs) {
    w.chip.textContent = text;
    w.chip.className = 'chip' + (isErr ? ' err' : '');
    clearTimeout(w.chipTimer);
    if (fadeMs) w.chipTimer = setTimeout(function () { w.chip.classList.add('hide'); }, fadeMs);
  }

  function setEditing(w, on) {
    w.editing = on;
    w.dot.classList.toggle('edit', on);
    w.input.classList.toggle('edit', on);
    w.input.readOnly = !on;
    w.dot.setAttribute('aria-label', on ? 'Сохранить ник' : 'Редактировать ник');
    if (on) { w.input.focus(); }
    else { w.input.blur(); }
  }
  function commitNick(w, i) {
    if (!w.editing) return;
    nicks[i] = w.input.value.trim();
    w.input.value = nicks[i];
    saveNicks();
    setEditing(w, false);
  }

  function build(i) {
    var slot = document.createElement('div'); slot.className = 'slot';
    var scaler = document.createElement('div'); scaler.className = 'scaler';
    var frame = document.createElement('iframe');
    frame.title = 'Окно ' + (i + 1);
    frame.setAttribute('allow', 'autoplay; clipboard-write; fullscreen');
    scaler.appendChild(frame);
    var chip = document.createElement('div');
    var btn = document.createElement('button');
    btn.className = 'btn'; btn.type = 'button';
    btn.setAttribute('aria-label', 'Развернуть окно ' + (i + 1));
    slot.appendChild(scaler); slot.appendChild(chip); slot.appendChild(btn);
    stage.appendChild(slot);

    var nick = document.createElement('div'); nick.className = 'nick';
    var dot = document.createElement('button'); dot.className = 'dot'; dot.type = 'button';
    dot.setAttribute('aria-label', 'Редактировать ник');
    var input = document.createElement('input');
    input.type = 'text'; input.placeholder = 'ник'; input.value = nicks[i] || '';
    input.readOnly = true; input.maxLength = 40;
    input.autocomplete = 'off'; input.autocapitalize = 'none';
    input.setAttribute('autocorrect', 'off'); input.spellcheck = false;
    input.setAttribute('aria-label', 'Ник окна ' + (i + 1));
    nick.appendChild(dot); nick.appendChild(input);
    stage.appendChild(nick);

    var w = { slot: slot, scaler: scaler, frame: frame, chip: chip, btn: btn,
              nick: nick, dot: dot, input: input, loaded: false, editing: false };
    makeChip(w, 'Загрузка…', false, 0);

    frame.addEventListener('load', function () {
      w.loaded = true; clearTimeout(w.timer);
      // load срабатывает и для страниц-заглушек браузера; содержимое чужого домена прочитать нельзя
      makeChip(w, 'Событие load получено. Если окно пустое — сайт не разрешает встраивание.', false, 5000);
    });
    w.timer = setTimeout(function () {
      if (!w.loaded) makeChip(w, 'Нет ответа 12 с: возможно, сайт запрещает встраивание (X-Frame-Options / frame-ancestors) или нет сети.', true, 0);
    }, TIMEOUT_MS);

    btn.addEventListener('click', function (e) { e.stopPropagation(); toggle(i); });
    dot.addEventListener('click', function (e) {
      e.stopPropagation();
      if (openIdx >= 0) return;               // в развёрнутом режиме не работает
      if (w.editing) commitNick(w, i); else setEditing(w, true);
    });
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); commitNick(w, i); }
    });
    if (GAME_URL === 'test') {
      frame.srcdoc = '<body style="margin:0;background:#0a7d4b;color:#fff;font:28px sans-serif;padding:24px">ТЕСТ ОКНА ' + (i + 1) + '<br>iframe работает</body>';
    } else {
      frame.src = GAME_URL;   // iframe создаётся один раз и не пересоздаётся
    }
    return w;
  }

  function geom(i) {
    var W = stage.clientWidth, H = stage.clientHeight, s, w, h, x, y;
    if (i === openIdx) {
      s = Math.min(W / DW, (H - NH) / DH);
      w = DW * s; h = DH * s;
      x = (W - w) / 2; y = NH + (H - NH - h) / 2;
    } else {
      var cw = (W - (COLS - 1) * GAP) / COLS, ch = (H - ROWS * NH) / ROWS;
      s = Math.min(cw / DW, ch / DH);
      w = DW * s; h = DH * s;
      var c = i % COLS, r = Math.floor(i / COLS);
      x = c * (cw + GAP) + (cw - w) / 2;
      y = r * (NH + ch) + NH + (ch - h) / 2;
    }
    return { s: s, w: w, h: h, x: x, y: y };
  }

  function layout() {
    wins.forEach(function (w, i) {
      var g = geom(i);
      w.slot.style.left = g.x + 'px';
      w.slot.style.top = g.y + 'px';
      w.slot.style.width = g.w + 'px';
      w.slot.style.height = g.h + 'px';
      w.scaler.style.transform = 'scale(' + g.s + ')';
      w.nick.style.left = g.x + 'px';
      w.nick.style.top = (g.y - NH) + 'px';
      w.nick.style.width = g.w + 'px';
    });
  }

  function toggle(i) {
    wins.forEach(function (w, k) { commitNick(w, k); });   // сохранить правки перед разворотом
    wins.forEach(function (w) { w.slot.classList.add('anim'); w.nick.classList.add('anim'); });
    openIdx = (openIdx === i) ? -1 : i;
    wins.forEach(function (w, k) {
      var isOpen = k === openIdx;
      w.slot.classList.toggle('open', isOpen);
      w.nick.classList.toggle('locked', isOpen);
      w.nick.classList.toggle('hide', openIdx >= 0 && !isOpen);
      w.btn.setAttribute('aria-label', (isOpen ? 'Свернуть' : 'Развернуть') + ' окно ' + (k + 1));
    });
    stage.classList.toggle('has-open', openIdx >= 0);
    veil.classList.toggle('on', openIdx >= 0);
    layout();
    setTimeout(function () {
      wins.forEach(function (w) { w.slot.classList.remove('anim'); w.nick.classList.remove('anim'); });
    }, 260);
  }

  for (var i = 0; i < COUNT; i++) wins.push(build(i));
  layout();

  var raf = 0;
  function relayout() { cancelAnimationFrame(raf); raf = requestAnimationFrame(layout); }
  window.addEventListener('resize', relayout);
  window.addEventListener('orientationchange', relayout);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', relayout);

  // Запрет pinch-zoom самой оболочки (внутри iframe жесты обрабатывает страница)
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
})();
</script>
</body>
</html>
